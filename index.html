<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="formulario.css">
</head>
<body>
  <center>
    <form>
      <h2>Formulario de contacto</h2>
      <p>Escríbenos y en breve nos pondremos en contacto contigo</p>

      <label for="nombre">Nombre *</label>
      <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>

      <label for="email">Email *</label>
      <input type="email" id="email" name="email" placeholder="Escribe tu Email" required>

      <label for="telefono">Teléfono *</label>
      <!-- Solo números, entre 7 y 15 dígitos -->
      <input type="tel" id="telefono" name="telefono" placeholder="Escribe tu teléfono"
             pattern="[0-9]{7,15}" required>

      <label for="sitio">Sitio web *</label>
      <input type="url" id="sitio" name="sitio" placeholder="Escribe la URL de tu web" required>

      <label for="asunto">Asunto *</label>
      <input type="text" id="asunto" name="asunto" placeholder="Escribe un asunto" required>

      <label for="mensaje">Mensaje *</label>
      <textarea id="mensaje" name="mensaje" placeholder="Deja aquí tu comentario..." required></textarea>

      <button type="submit">ENVIAR</button>
      <p class="note">* Los campos son obligatorios.</p>
    </form>
  </center>
</body>
</html>
